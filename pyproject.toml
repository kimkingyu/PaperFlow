[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflow-mcp"
version = "0.1.0"
description = "Local research workspace with a built-in agent, evidence-backed academic writing, and MCP tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PaperFlow Contributors" }
]
keywords = ["mcp", "word", "office", "academic", "paper-writing", "zotero", "workbuddy", "qwen", "claude"]
dependencies = [
    "mcp>=1.0.0",
    "python-docx>=1.1.0",
    "pydantic>=2.0.0",
    "pywin32>=305; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "PyYAML>=6,<7", "httpx>=0.27,<1"]
pdf = ["pypdf>=6.19,<7"]
gui = ["keyring>=25,<27", "starlette>=0.37.2,<2", "uvicorn>=0.30,<1", "jsonschema>=4.22,<5"]

[project.scripts]
paperflow = "paperflow.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["paperflow*"]

[tool.setuptools.package-data]
paperflow = [
    "resources/journals/curated_candidates.json",
    "resources/journals/open_metadata.json",
    "resources/journals/source_audit.json",
    "resources/journals/source_catalog.json",
    "gui/static/*.html",
    "gui/static/app/index.html",
    "gui/static/app/favicon.svg",
    "gui/static/app/assets/*",
]
